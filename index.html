<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢境之痕</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d0d0d;
      color: #d1d1d1;
      font-family: 'PingFang TC', 'Microsoft JhengHei', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    #game-container {
      width: 100%;
      max-width: 620px;
      background: #171717;
      padding: 28px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #2a2a2a;
    }
    #speaker-name {
      font-size: 0.95rem;
      color: #8b9bb4;
      font-weight: bold;
      margin-bottom: 12px;
      min-height: 1.2em;
      letter-spacing: 1px;
    }
    #text-box {
      font-size: 1.05rem;
      line-height: 1.9;
      min-height: 110px;
      margin-bottom: 24px;
      white-space: pre-wrap;
      color: #e0e0e0;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      margin-top: 12px;
      background: #222222;
      color: #c5c5c5;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-size: 0.98rem;
      transition: all 0.25s ease;
    }
    .option-btn:hover {
      background: #2d3748;
      color: #ffffff;
      border-color: #4a5568;
    }
    .reality-btn {
      border-color: #5a3e3e;
      color: #d4a5a5;
    }
    .reality-btn:hover {
      background: #4a2828;
      border-color: #8c4a4a;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="speaker-name"></div>
  <div id="text-box">載入夢境中...</div>
  <div id="options-container"></div>
</div>

<script>
  let storyData = {};
  let currentSceneId = '';
  let currentDialogues = [];
  let dialogueIndex = 0;
  let currentOptions = [];
  let onDialogueComplete = null;

  // 玩家隱藏狀態與數值紀錄
  const gameState = {
    contradiction: 0, // 矛盾值
    violence: 0,      // 暴力值
    rationality: 0,   // 理性值
    suspicion: 0,     // 多疑值
    ghost_ask_count: 0 // 質問「是不是現實」累計次數
  };

  fetch('story.json')
    .then(res => res.json())
    .then(data => {
      storyData = data;
      const startScene = storyData['gap'] ? 'gap' : 'start';
      renderScene(startScene);
    })
    .catch(err => {
      document.getElementById('text-box').innerText = '夢境崩塌，請檢查 story.json 格式。';
    });

  function renderScene(sceneId) {
    currentSceneId = sceneId;
    const scene = storyData[sceneId];
    if (!scene) return;

    if (scene.text && !scene.dialogues) {
      currentDialogues = [{ speaker: scene.speaker || '', text: scene.text }];
    } else {
      currentDialogues = scene.dialogues || [];
    }

    currentOptions = scene.options || [];
    onDialogueComplete = renderOptions;
    
    dialogueIndex = 0;
    showNextDialogue();
  }

  function showNextDialogue() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (dialogueIndex < currentDialogues.length) {
      const current = currentDialogues[dialogueIndex];
      document.getElementById('speaker-name').innerText = current.speaker ? `【 ${current.speaker} 】` : '';
      document.getElementById('text-box').innerText = current.text;
      dialogueIndex++;

      if (dialogueIndex < currentDialogues.length) {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'option-btn';
        nextBtn.innerText = '▼ 繼續';
        nextBtn.onclick = showNextDialogue;
        container.appendChild(nextBtn);
      } else {
        if (onDialogueComplete) onDialogueComplete();
      }
    } else {
      if (onDialogueComplete) onDialogueComplete();
    }
  }

  function renderOptions() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (currentOptions.length === 0) {
      document.getElementById('text-box').innerText += '\n\n【 夢境暫時終止 】';
      return;
    }

    currentOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if (opt.is_reality_check) btn.classList.add('reality-btn');
      btn.innerText = opt.text;
      btn.onclick = () => handleOptionClick(opt);
      container.appendChild(btn);
    });
  }

  function handleOptionClick(option) {
    // 紀錄數值變動
    if (option.stats) {
      for (const [key, value] of Object.entries(option.stats)) {
        if (gameState.hasOwnProperty(key)) gameState[key] += value;
      }
    }

    // 處理「質問是不是現實」邏輯
    if (option.is_reality_check) {
      gameState.suspicion += 1;
      if (option.is_ghost_target) {
        gameState.ghost_ask_count += 1;
      }
    }

    if (option.reply && option.reply.length > 0) {
      currentDialogues = option.reply;
      dialogueIndex = 0;
      onDialogueComplete = () => {
        if (option.target && option.target !== currentSceneId) {
          renderScene(option.target);
        } else {
          renderOptions();
        }
      };
      showNextDialogue();
    } else if (option.target) {
      renderScene(option.target);
    }
  }
</script>

</body>
</html>
