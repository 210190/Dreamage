<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字視覺小說</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    #game-container {
      width: 100%;
      max-width: 600px;
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }
    #speaker-name {
      font-size: 0.95rem;
      color: #3b82f6;
      font-weight: bold;
      margin-bottom: 8px;
      min-height: 1.2em; /* 防止切換說話者時畫面閃爍跳動 */
    }
    #text-box {
      font-size: 1.05rem;
      line-height: 1.8;
      min-height: 100px;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-top: 10px;
      background: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .option-btn:hover {
      background: #3b82f6;
      border-color: #3b82f6;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="speaker-name"></div>
  <div id="text-box">載入劇本中...</div>
  <div id="options-container"></div>
</div>

<script>
  let storyData = {};
  let currentDialogues = [];
  let dialogueIndex = 0;
  let currentOptions = [];

  // 使用 fetch 動態讀取 story.json
  fetch('story.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('網絡回應不正常');
      }
      return response.json();
    })
    .then(data => {
      storyData = data;
      // 優先讀取 gap，若無則讀取 start
      const startScene = storyData['gap'] ? 'gap' : 'start';
      renderScene(startScene);
    })
    .catch(error => {
      console.error('載入劇本失敗:', error);
      document.getElementById('text-box').innerText = '劇本載入失敗，請確認 story.json 檔案格式與語法是否正確。';
    });

  function renderScene(sceneId) {
    const scene = storyData[sceneId];
    if (!scene) {
      console.error(`找不到目標場景 ID: ${sceneId}`);
      return;
    }

    // 相容性處理：如果舊場景只寫了 text，自動轉成單句的 dialogues 陣列
    if (scene.text && !scene.dialogues) {
      currentDialogues = [{ speaker: scene.speaker || '', text: scene.text }];
    } else {
      currentDialogues = scene.dialogues || [];
    }

    dialogueIndex = 0;
    currentOptions = scene.options || [];

    showNextDialogue();
  }

  function showNextDialogue() {
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    // 如果對話陣列裡面還有未讀取的句子
    if (dialogueIndex < currentDialogues.length) {
      const current = currentDialogues[dialogueIndex];
      
      // 更新說話者名稱與文字內文
      document.getElementById('speaker-name').innerText = current.speaker ? `【 ${current.speaker} 】` : '';
      document.getElementById('text-box').innerText = current.text;

      dialogueIndex++;

      // 建立「點擊繼續」按鈕
      const nextBtn = document.createElement('button');
      nextBtn.className = 'option-btn';
      
      // 如果這句是最後一句對話，且後面有選擇肢，按鈕提示玩家進選擇
      if (dialogueIndex === currentDialogues.length && currentOptions.length > 0) {
        nextBtn.innerText = '▼ （點擊進行選擇）';
      } else {
        nextBtn.innerText = '▼ 繼續';
      }
      
      nextBtn.onclick = showNextDialogue;
      optionsContainer.appendChild(nextBtn);
    } else {
      // 所有對話閱讀完畢，渲染該場景的分歧選項
      renderOptions();
    }
  }

  function renderOptions() {
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    if (currentOptions.length === 0) {
      document.getElementById('text-box').innerText += '\n\n【 劇本結束 】';
      return;
    }

    currentOptions.forEach(opt => {
      const button = document.createElement('button');
      button.className = 'option-btn';
      button.innerText = opt.text;
      button.onclick = () => renderScene(opt.target);
      optionsContainer.appendChild(button);
    });
  }
</script>

</body>
</html>
