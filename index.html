<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字視覺小說</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    #game-container {
      width: 100%;
      max-width: 600px;
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }
    #speaker-name {
      font-size: 0.95rem;
      color: #3b82f6;
      font-weight: bold;
      margin-bottom: 8px;
    }
    #text-box {
      font-size: 1.05rem;
      line-height: 1.8;
      min-height: 100px;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-top: 10px;
      background: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .option-btn:hover {
      background: #3b82f6;
      border-color: #3b82f6;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="speaker-name"></div>
  <div id="text-box">載入劇本中...</div>
  <div id="options-container"></div>
</div>

<script>
  let storyData = {};

  // 使用 fetch 動態讀取同目錄下的 story.json 檔案
  fetch('story.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('網絡回應不正常');
      }
      return response.json();
    })
    .then(data => {
      storyData = data;
      renderScene('start'); // 讀取成功後進入開頭場景
    })
    .catch(error => {
      console.error('載入劇本失敗:', error);
      document.getElementById('text-box').innerText = '劇本載入失敗，請確認 story.json 檔案格式是否正確。';
    });

  function renderScene(sceneId) {
    const scene = storyData[sceneId];
    if (!scene) return;

    // 更新講話者與劇本內文
    document.getElementById('speaker-name').innerText = scene.speaker ? `【 ${scene.speaker} 】` : '';
    document.getElementById('text-box').innerText = scene.text;

    // 清空並重新渲染選項按鈕
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    scene.options.forEach(opt => {
      const button = document.createElement('button');
      button.className = 'option-btn';
      button.innerText = opt.text;
      button.onclick = () => renderScene(opt.target);
      optionsContainer.appendChild(button);
    });
  }
</script>

</body>
</html>
