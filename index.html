<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢境之痕</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Serif CJK TC', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    #game-container {
      width: 100%;
      max-width: 640px;
      background: #12141d;
      padding: 32px;
      border-radius: 4px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      border: 1px solid #1f2833;
    }
    #speaker-name {
      font-size: 0.9rem;
      color: #66fcf1;
      font-weight: 600;
      margin-bottom: 14px;
      min-height: 1.2em;
      letter-spacing: 2px;
    }
    #text-box {
      font-size: 1.02rem;
      line-height: 2;
      min-height: 120px;
      margin-bottom: 28px;
      white-space: pre-wrap;
      color: #edf5e1;
      letter-spacing: 0.5px;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin-top: 10px;
      background: #1f2833;
      color: #c5c6c7;
      border: 1px solid #2c3e50;
      border-radius: 2px;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .option-btn:hover {
      background: #45a29e;
      color: #0b0c10;
      border-color: #66fcf1;
      font-weight: 500;
    }
    .reality-btn {
      border-color: #5c2c2c;
      color: #e0a8a8;
    }
    .reality-btn:hover {
      background: #8b0000;
      color: #ffffff;
      border-color: #ff4d4d;
    }
    .anomaly-btn {
      border-color: #5c4d2c;
      color: #e0d1a8;
    }
    .anomaly-btn:hover {
      background: #b8860b;
      color: #0b0c10;
      border-color: #ffd700;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="speaker-name"></div>
  <div id="text-box">意識同步中...</div>
  <div id="options-container"></div>
</div>

<script>
  let storyData = {};
  let currentSceneId = '';
  let currentDialogues = [];
  let dialogueIndex = 0;
  let currentOptions = [];
  let onDialogueComplete = null;

  const GHOST_INTENTS = ['destroy_brain', 'keep_in_dream', 'make_mad'];
  const GHOST_PERSONALITIES = ['joker', 'genius', 'resentment'];

  const gameState = {
    contradiction: 0,
    violence: 0,
    rationality: 0,
    suspicion: 0,
    ghost_ask_count: 0,
    bar_visit_count: 0,
    heard_alley_tip: false,
    ghost_encountered: false,
    ghost_intent: GHOST_INTENTS[Math.floor(Math.random() * GHOST_INTENTS.length)],
    ghost_personality: GHOST_PERSONALITIES[Math.floor(Math.random() * GHOST_PERSONALITIES.length)]
  };

  fetch('story.json')
    .then(res => res.json())
    .then(data => {
      storyData = data;
      const startScene = storyData['gap'] ? 'gap' : 'start';
      renderScene(startScene);
    })
    .catch(err => {
      document.getElementById('text-box').innerText = '架構崩解。請檢查 story.json 格式。';
    });

  function renderScene(sceneId) {
    currentSceneId = sceneId;

    if (sceneId === 'alley') {
      if (gameState.ghost_encountered) {
        sceneId = 'alley_empty';
      } else if (gameState.heard_alley_tip) {
        sceneId = 'alley_ghost_aware';
      } else {
        sceneId = 'alley_ghost_unaware';
      }
    }

    if (sceneId === 'bar') {
      gameState.bar_visit_count++;
    }

    const scene = storyData[sceneId];
    if (!scene) return;

    if (scene.ghost_dialogues && scene.ghost_dialogues[gameState.ghost_personality]) {
      currentDialogues = scene.ghost_dialogues[gameState.ghost_personality];
    } else if (scene.text && !scene.dialogues) {
      currentDialogues = [{ speaker: scene.speaker || '', text: scene.text }];
    } else {
      currentDialogues = scene.dialogues || [];
    }

    currentOptions = [...(scene.options || [])];
    if (sceneId === 'bar' && gameState.bar_visit_count > 1) {
      const anomalyExists = currentOptions.some(opt => opt.target === 'bar_anomaly');
      if (!anomalyExists) {
        currentOptions.unshift({
          text: "空間的維度感正在變得扁平...",
          target: "bar_anomaly",
          is_anomaly: true
        });
      }
    }

    onDialogueComplete = renderOptions;
    dialogueIndex = 0;
    showNextDialogue();
  }

  function showNextDialogue() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (dialogueIndex < currentDialogues.length) {
      const current = currentDialogues[dialogueIndex];
      document.getElementById('speaker-name').innerText = current.speaker ? `【 ${current.speaker} 】` : '';
      document.getElementById('text-box').innerText = current.text;
      dialogueIndex++;

      if (dialogueIndex < currentDialogues.length) {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'option-btn';
        nextBtn.innerText = '…';
        nextBtn.onclick = showNextDialogue;
        container.appendChild(nextBtn);
      } else {
        if (onDialogueComplete) onDialogueComplete();
      }
    } else {
      if (onDialogueComplete) onDialogueComplete();
    }
  }

  function renderOptions() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (currentOptions.length === 0) {
      document.getElementById('text-box').innerText += '\n\n【 意識鏈條中斷 】';
      return;
    }

    currentOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if (opt.is_reality_check) btn.classList.add('reality-btn');
      if (opt.is_anomaly) btn.classList.add('anomaly-btn');
      btn.innerText = opt.text;
      btn.onclick = () => handleOptionClick(opt);
      container.appendChild(btn);
    });
  }

  function handleOptionClick(option) {
    if (option.set_alley_tip) gameState.heard_alley_tip = true;
    if (option.set_ghost_encountered) gameState.ghost_encountered = true;

    if (option.stats) {
      for (const [key, value] of Object.entries(option.stats)) {
        if (gameState.hasOwnProperty(key)) gameState[key] += value;
      }
    }

    if (option.is_reality_check) {
      gameState.suspicion += 1;
      if (option.is_ghost_target) {
        gameState.ghost_ask_count += 1;
      }
    }

    if (option.ghost_replies && option.ghost_replies[gameState.ghost_personality]) {
      currentDialogues = option.ghost_replies[gameState.ghost_personality];
      dialogueIndex = 0;
      onDialogueComplete = () => {
        if (option.target && option.target !== currentSceneId) {
          renderScene(option.target);
        } else {
          renderOptions();
        }
      };
      showNextDialogue();
    } else if (option.reply && option.reply.length > 0) {
      currentDialogues = option.reply;
      dialogueIndex = 0;
      onDialogueComplete = () => {
        if (option.target && option.target !== currentSceneId) {
          renderScene(option.target);
        } else {
          renderOptions();
        }
      };
      showNextDialogue();
    } else if (option.target) {
      renderScene(option.target);
    }
  }
</script>

</body>
</html>
