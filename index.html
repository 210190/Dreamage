<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字視覺小說</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    #game-container {
      width: 100%;
      max-width: 600px;
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }
    #speaker-name {
      font-size: 0.95rem;
      color: #3b82f6;
      font-weight: bold;
      margin-bottom: 8px;
      min-height: 1.2em;
    }
    #text-box {
      font-size: 1.05rem;
      line-height: 1.8;
      min-height: 100px;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-top: 10px;
      background: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .option-btn:hover {
      background: #3b82f6;
      border-color: #3b82f6;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="speaker-name"></div>
  <div id="text-box">載入劇本中...</div>
  <div id="options-container"></div>
</div>

<script>
  let storyData = {};
  let currentSceneId = '';
  let currentDialogues = [];
  let dialogueIndex = 0;
  let currentOptions = [];
  let onDialogueComplete = null;

  fetch('story.json')
    .then(res => res.json())
    .then(data => {
      storyData = data;
      const startScene = storyData['gap'] ? 'gap' : 'start';
      renderScene(startScene);
    })
    .catch(err => {
      document.getElementById('text-box').innerText = '劇本載入失敗，請檢查 story.json 格式。';
    });

  function renderScene(sceneId) {
    currentSceneId = sceneId;
    const scene = storyData[sceneId];
    if (!scene) return;

    if (scene.text && !scene.dialogues) {
      currentDialogues = [{ speaker: scene.speaker || '', text: scene.text }];
    } else {
      currentDialogues = scene.dialogues || [];
    }

    currentOptions = scene.options || [];
    onDialogueComplete = renderOptions;
    
    dialogueIndex = 0;
    showNextDialogue();
  }

  function showNextDialogue() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (dialogueIndex < currentDialogues.length) {
      const current = currentDialogues[dialogueIndex];
      document.getElementById('speaker-name').innerText = current.speaker ? `【 ${current.speaker} 】` : '';
      document.getElementById('text-box').innerText = current.text;
      dialogueIndex++;

      // 如果後面還有對話，顯示「繼續」按鈕；如果已經是最後一句，直接繪製選項！
      if (dialogueIndex < currentDialogues.length) {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'option-btn';
        nextBtn.innerText = '▼ 繼續';
        nextBtn.onclick = showNextDialogue;
        container.appendChild(nextBtn);
      } else {
        if (onDialogueComplete) onDialogueComplete();
      }
    } else {
      if (onDialogueComplete) onDialogueComplete();
    }
  }

  function renderOptions() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (currentOptions.length === 0) {
      document.getElementById('text-box').innerText += '\n\n【 劇本結束 】';
      return;
    }

    currentOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => handleOptionClick(opt);
      container.appendChild(btn);
    });
  }

  function handleOptionClick(option) {
    if (option.reply && option.reply.length > 0) {
      currentDialogues = option.reply;
      dialogueIndex = 0;
      onDialogueComplete = () => {
        if (option.target && option.target !== currentSceneId) {
          renderScene(option.target);
        } else {
          renderOptions();
        }
      };
      showNextDialogue();
    } else if (option.target) {
      renderScene(option.target);
    }
  }
</script>

</body>
</html>
